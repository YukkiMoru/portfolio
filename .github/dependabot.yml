version: 2
updates:
  # Pythonパッケージ（MkDocsやプラグイン）の定期アップデート
  # uvプロジェクトとして pyproject.toml / uv.lock を検知するように設定
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly" # 毎週チェックする
    labels:
      - "dependencies"
    automerged: true 
    # パッチバージョンのみ自動マージ
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"] # メジャーアップデートは手動にする